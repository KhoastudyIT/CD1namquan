# Lớp phủ production cho VPS — dùng KÈM docker-compose.yml, không thay thế:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Việc duy nhất nó làm: đóng các cổng quản trị lại. File gốc publish Postgres
# (5433) và MinIO Console (9001) ra mọi interface — trên máy cá nhân thì tiện,
# nhưng trên VPS là mở thẳng database ra Internet cho cả thế giới dò mật khẩu.
#
# Sau khi phủ, 5433 và 9001 chỉ nghe trên loopback. Muốn vào từ máy bạn thì
# đi qua SSH tunnel (xem DOCKER.md), không mở cổng ra ngoài.

services:
  postgres:
    ports:
      - "127.0.0.1:5433:5432"

  minio:
    ports:
      - "9000:9000"              # S3 API — trình duyệt cần gọi trực tiếp
      - "127.0.0.1:9001:9001"    # Console quản trị — chỉ qua SSH tunnel
